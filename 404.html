<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Travel OS · 頁面轉址</title></head><body>
<p>正在進入 Travel OS… <a href="/travel-os/">開啟 Travel OS</a></p>
<script>
(function(){
  const base='/travel-os/';
  if(!location.pathname.startsWith(base)){return;}
  const rel=location.pathname.slice(base.length).split('/').filter(Boolean);
  const slug=(rel[0]||'').match(/^([a-z0-9]+(?:-[a-z0-9]+)*)$/i)?.[1]||'';
  const params=new URLSearchParams(location.search);
  if(slug&&slug!=='index')params.set('trip',slug);
  const query=params.toString();
  location.replace(base+(query?'?'+query:'')+location.hash);
})();
</script></body></html>
